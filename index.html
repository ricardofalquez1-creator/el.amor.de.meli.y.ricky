    <style>
        :root {
            --pink: #ff4d6d;
            --dark: #1a1a1a;
            --bg: #fff5f7;
        }

        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background-color: var(--bg); font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-x: hidden; position: relative; color: var(--dark);
        }

        h1 {
            color: var(--pink); font-size: 2.5rem; text-align: center;
            margin-bottom: 30px; font-weight: 900; z-index: 10;
            text-shadow: 2px 2px 4px rgba(255, 77, 109, 0.1);
        }

        /* --- MURO ESTÁTICO PERSISTENTE --- */
        #word-wall { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; pointer-events: none; 
        }
        .static-word {
            position: absolute; color: var(--pink); font-weight: bold; 
            opacity: 0.25; white-space: nowrap; font-size: 1.1rem;
            animation: fadeIn 2s ease-out forwards; z-index: 1;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 0.25; } }

        /* --- CONTADORES GIGANTES (200px) --- */
        .dashboard { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; z-index: 10; margin-bottom: 30px; }
        .heart-clock { position: relative; width: 180px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .heart-shape { position: absolute; width: 100%; height: 100%; fill: white; filter: drop-shadow(0 8px 15px rgba(255, 77, 109, 0.2)); z-index: -1; }
        .days-value { font-size: 2.5rem; font-weight: 900; color: var(--pink); margin: 0; line-height: 1; }
        .label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-top: 5px; color: #555; padding: 0 15px; max-width: 140px; }

        /* --- CARRUSEL TIPO CINTA AJUSTADO --- */
        .carousel-container { 
            width: 100vw; 
            height: 260px; 
            z-index: 10; 
            margin: 20px 0; 
            overflow: hidden; 
            position: relative;
            display: flex;
            align-items: center;
        }

        .carousel-track { 
            display: flex; 
            width: fit-content; 
            animation: scroll-slow 35s linear infinite; 
        }

        .carousel-track:hover { animation-play-state: paused; }

        /* AJUSTE MARCOS POLAROID */
        .polaroid { 
            background: white; 
            padding: 8px 8px 25px 8px; /* Reducido el aire interno */
            margin: 0 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            border-radius: 2px; 
            flex-shrink: 0; 
            width: 170px; /* Tamaño del marco más compacto */
            transition: transform 0.3s;
            cursor: pointer;
        }

        .polaroid img { 
            width: 100%; /* La imagen ocupa todo el ancho del padding */
            height: 170px; /* Imagen cuadrada */
            object-fit: cover; 
            border: 1px solid #eee;
        }

        .polaroid:hover { transform: scale(1.1) !important; z-index: 50; }

        @keyframes scroll-slow {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-190px * 10)); } /* Ajustado al nuevo ancho + margen */
        }

        /* --- BOTÓN JUGAR --- */
        .play-btn {
            background: #5d3fd3; color: white; border: none; padding: 12px 35px;
            border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none;
            font-size: 15px; margin: 15px 0; z-index: 20; box-shadow: 0 5px 15px rgba(93, 63, 211, 0.3);
            transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.05); background: #4b32ac; }

        /* --- SPOTIFY --- */
        .spotify-container { margin: 15px 0; z-index: 20; width: 90%; max-width: 380px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        /* --- INPUT --- */
        .input-container { margin: 20px 0; display: flex; gap: 8px; z-index: 20; background: white; padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        input { border: none; padding: 8px 15px; border-radius: 50px; outline: none; width: 160px; }
        .send-btn { background: var(--pink); color: white; border: none; padding: 8px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* --- VISOR Y OVERLAY --- */
        #visor-fotos { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #foto-grande { max-width: 90%; max-height: 85vh; border: 4px solid white; border-radius: 4px; }
        .heart-particle { position: fixed; top: -10px; color: #ff4d6d; font-size: 20px; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        #forever-overlay { display: none; position: fixed; inset: 0; background: var(--pink); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 30px; }
    </style>

<script>

        apiKey: "AIzaSyAWDuppxTJ0YH3PMgy8zERSsZ5CjRI2O-g",

    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function lluviaDeCorazones() {
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, i * 100);
        }
    }

    function enviarMensaje() {
        const input = document.getElementById('mensajeInput');
        if(input.value.trim() === "") return;
        const password = prompt("Introduce la clave secreta:");
        if (password === "CocacolaSprite") {
            lluviaDeCorazones();
            database.ref('muro').push({
                texto: input.value,
                x: Math.random() * 85 + 5,
                y: Math.random() * 85 + 5
            });
            input.value = '';
        } else {
            alert("Clave incorrecta 🌹");
        }
    }

    database.ref('muro').on('child_added', (snapshot) => {
        const data = snapshot.val();
        if(data && data.texto) {
            const el = document.createElement('div');
            el.className = 'static-word';
            el.innerText = data.texto;
            el.style.left = data.x + '%';
            el.style.top = data.y + '%';
            el.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
            document.getElementById('word-wall').appendChild(el);
        }
    });

    function actualizarContadores() {
        const hoy = new Date();
        const diff = (f) => Math.floor((hoy - f) / (1000 * 60 * 60 * 24));
        document.getElementById('days-met').innerText = diff(new Date(2025, 7, 19));
        document.getElementById('days-out').innerText = diff(new Date(2025, 8, 23));
        document.getElementById('days-gf').innerText = diff(new Date(2025, 11, 7));
    }
    actualizarContadores();

    function abrirFoto(src) { document.getElementById('foto-grande').src = src; document.getElementById('visor-fotos').style.display = 'flex'; }
    function cerrarFoto() { document.getElementById('visor-fotos').style.display = 'none'; }
    function darDeBaja() { document.getElementById('forever-overlay').style.display = 'flex'; }
    function cerrar() { document.getElementById('forever-overlay').style.display = 'none'; }

    // Aplicar rotaciones aleatorias a las fotos al cargar
    document.querySelectorAll('.polaroid').forEach(p => {
        p.style.transform = `rotate(${Math.random() * 6 - 3}deg)`;
    });
