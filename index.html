<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz San Valentín Mi Amor</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --pink: #ff4d6d;
            --dark: #1a1a1a;
            --bg: #fff5f7;
        }

        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background-color: var(--bg); font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-x: hidden; position: relative; color: var(--dark);
        }

        /* --- TÍTULO --- */
        h1 {
            color: var(--pink);
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(255, 77, 109, 0.1);
            z-index: 10;
        }

        /* --- CONTADORES GIGANTES (200px) --- */
        .dashboard { 
            display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; 
            z-index: 10; margin-bottom: 40px; 
        }
        .heart-clock { 
            position: relative; width: 200px; height: 200px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }
        .heart-shape { 
            position: absolute; width: 100%; height: 100%; fill: white; 
            filter: drop-shadow(0 8px 15px rgba(255, 77, 109, 0.2)); z-index: -1; 
        }
        .days-value { font-size: 2.8rem; font-weight: 900; color: var(--pink); margin: 0; line-height: 1; }
        .label { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-top: 8px; color: #555; }

        /* --- CARRUSEL POLAROID --- */
        .carousel-container { 
            width: 210px; height: 270px; z-index: 10; perspective: 1000px; margin-bottom: 20px;
        }
        .carousel-track { display: flex; width: 1000%; height: 100%; animation: slide-10 40s infinite ease-in-out; }
        .polaroid { 
            background: white; padding: 10px 10px 40px 10px; margin: 10px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-radius: 2px; 
            transform: rotate(calc(-2deg + 4deg * Math.random()));
        }
        .polaroid img { width: 190px; height: 190px; object-fit: cover; border: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s; }
        .polaroid img:hover { transform: scale(1.05); }

        @keyframes slide-10 {
            0%, 8% { transform: translateX(0); }
            10%, 18% { transform: translateX(-10%); }
            20%, 28% { transform: translateX(-20%); }
            30%, 38% { transform: translateX(-30%); }
            40%, 48% { transform: translateX(-40%); }
            50%, 58% { transform: translateX(-50%); }
            60%, 68% { transform: translateX(-60%); }
            70%, 78% { transform: translateX(-70%); }
            80%, 88% { transform: translateX(-80%); }
            90%, 98% { transform: translateX(-90%); }
            100% { transform: translateX(0); }
        }

        /* --- BOTÓN JUGAR --- */
        .play-btn {
            background: #5d3fd3; color: white; border: none; padding: 15px 40px;
            border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none;
            font-size: 16px; margin: 20px 0; z-index: 20;
            box-shadow: 0 5px 15px rgba(93, 63, 211, 0.3); transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.05); background: #4b32ac; }

        /* --- SPOTIFY COMPACTO (152px) --- */
        .spotify-container { 
            margin: 20px 0; z-index: 20; width: 95%; max-width: 400px; 
            border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* --- MENSAJES Y MURO --- */
        #word-wall { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .floating-word {
            position: absolute; color: var(--pink); font-weight: bold; opacity: 0;
            white-space: nowrap; font-size: 1.2rem; animation: floatUp 15s linear infinite;
            z-index: 1; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.25; }
            90% { opacity: 0.25; }
            100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
        }

        .input-container { margin: 30px 0; display: flex; gap: 8px; z-index: 20; background: white; padding: 8px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { border: none; padding: 10px 20px; border-radius: 50px; outline: none; width: 200px; }
        .send-btn { background: var(--pink); color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; }

        /* --- OTROS --- */
        #visor-fotos {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 2000;
            justify-content: center; align-items: center; cursor: zoom-out;
        }
        #foto-grande { max-width: 90%; max-height: 80vh; border: 5px solid white; border-radius: 5px; }

        .heart-particle { position: fixed; top: -10px; color: #ff4d6d; font-size: 20px; user-select: none; pointer-events: none; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        #forever-overlay { display: none; position: fixed; inset: 0; background: var(--pink); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; }
    </style>
</head>
<body>

    <div id="word-wall"></div>

    <h1>Contador de nuestra historia</h1>

    <div class="dashboard">
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-met">0</p>
            <p class="label">Conocernos</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-out">0</p>
            <p class="label">1ra Cita</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-gf">0</p>
            <p class="label">Novios</p>
        </div>
    </div>

    <div class="carousel-container">
        <div class="carousel-track">
            <div class="polaroid"><img src="FOTO1.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO2.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO3.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO4.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO5.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO6.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO7.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO8.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO9.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="FOTO10.jpg" onclick="abrirFoto(this.src)"></div>
        </div>
    </div>

    <a href="https://view.genially.com/6991621c3d6d6d7dbf5e93a7/interactive-content-reto-8bits" target="_blank" class="play-btn">🎮 JUGAR</a>

    <div class="spotify-container">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5Nf8YaO5XmmCXB0IovkS7v?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <div class="input-container">
        <input type="text" id="mensajeInput" placeholder="Dile algo lindo...">
        <button class="send-btn" onclick="enviarMensaje()">Postear</button>
    </div>

    <div id="visor-fotos" onclick="cerrarFoto()">
        <img id="foto-grande" src="">
    </div>

    <button onclick="darDeBaja()" style="background:none; border:none; color:#bbb; font-size:10px; cursor:pointer; opacity: 0.5;">Desuscribirse</button>

    <div id="forever-overlay">
        <h2>ERROR 237</h2>
        <p>¡Patricia Fernández, venga para acá!</p>
        <button onclick="cerrar()" style="margin-top:20px; padding:10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer;">Volver</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAWDuppxTJ0YH3PMgy8zERSsZ5CjRI2O-g",
        authDomain: "regalosanvalentin-488f4.firebaseapp.com",
        databaseURL: "https://regalosanvalentin-488f4-default-rtdb.firebaseio.com",
        projectId: "regalosanvalentin-488f4",
        storageBucket: "regalosanvalentin-488f4.firebasestorage.app",
        messagingSenderId: "606948409590",
        appId: "1:606948409590:web:93151713372f334eeb2cd7"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function lluviaDeCorazones() {
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, i * 100);
        }
    }

    function enviarMensaje() {
        const input = document.getElementById('mensajeInput');
        if(input.value.trim() !== "") {
            lluviaDeCorazones();
            database.ref('muro').push({
                texto: input.value,
                x: Math.random() * 80 + 10,
                pass: "CocacolaSprite"
            });
            input.value = '';
        }
    }

    database.ref('muro').on('child_added', (snapshot) => {
        const data = snapshot.val();
        if(data && data.texto) {
            const el = document.createElement('div');
            el.className = 'floating-word';
            el.innerText = data.texto;
            el.style.left = data.x + '%';
            document.getElementById('word-wall').appendChild(el);
            setTimeout(() => el.remove(), 15000);
        }
    });

    function actualizarContadores() {
        const hoy = new Date();
        const diff = (f) => Math.floor((hoy - f) / (1000 * 60 * 60 * 24));
        document.getElementById('days-met').innerText = diff(new Date(2025, 7, 19));
        document.getElementById('days-out').innerText = diff(new Date(2025, 8, 23));
        document.getElementById('days-gf').innerText = diff(new Date(2025, 11, 7));
    }
    actualizarContadores();

    function abrirFoto(src) {
        document.getElementById('foto-grande').src = src;
        document.getElementById('visor-fotos').style.display = 'flex';
    }
    function cerrarFoto() { document.getElementById('visor-fotos').style.display = 'none'; }
    function darDeBaja() { document.getElementById('forever-overlay').style.display = 'flex'; }
    function cerrar() { document.getElementById('forever-overlay').style.display = 'none'; }
</script>
</body>
</html>
